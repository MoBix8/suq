<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SUQ ADMIN">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SUQ ADMIN">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta name="theme-color" content="#1E4B8F">
  <title>SUQ ADMIN</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #brand-splash { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; justify-items: center; gap: 20px; background: #1E4B8F; color: white; font: 700 20px 'Segoe UI', sans-serif; letter-spacing: .12em; transition: opacity .2s ease; }
    #brand-splash img { width: min(56vw, 240px); height: auto; }
    #brand-splash.done { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="brand-splash"><img src="assets/branding/qaf_logo.png" alt=""><span>SUQ ADMIN</span></div>
  <script>window.addEventListener('flutter-first-frame', function () { var splash = document.getElementById('brand-splash'); splash.classList.add('done'); setTimeout(function () { splash.remove(); }, 250); }, { once: true });</script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
